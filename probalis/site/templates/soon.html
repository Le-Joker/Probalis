{% extends "base.html" %}
{% block content %}
<div class="intro">
  <div class="kicker">{{ t.soon }}</div>
  <h1 class="h1">{{ title }}</h1>
</div>
<section class="soon">
  <span class="f-ring" aria-hidden="true"></span>
  <span class="soon-ic">{{ icon(big_icon, 28, 2) }}</span>
  <h2>{{ t.soon }}</h2>
  <p>{{ message }}</p>
  <ul>
  {% for f in features %}
    <li>{{ icon('check', 16, 2.6) }}{{ f }}</li>
  {% endfor %}
  </ul>
</section>
{% endblock %}
