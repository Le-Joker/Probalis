<!doctype html>
<html lang="[[ lang ]]">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>[[ subject ]]</title>
</head>
<body style="margin:0;padding:0;background:#F3F5F8;-webkit-text-size-adjust:100%;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#F3F5F8;">[[ preheader ]]&#8199;&#65279;&#847;&#8199;&#65279;&#847;&#8199;&#65279;&#847;</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F3F5F8" style="background:#F3F5F8;">
<tr><td align="center" style="padding:24px 12px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
    <tr><td style="padding:0 4px 16px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
        <td><img src="{{site_url}}/icons/icone-192.png" width="40" height="40" alt="" style="display:block;border:0;border-radius:11px;"></td>
        <td style="padding-left:10px;font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;color:#0B1F3A;letter-spacing:-0.5px;">Proba<span style="color:#16A34A;">lis</span></td>
      </tr></table>
    </td></tr>
    <tr><td bgcolor="#0B1F3A" style="background:#0B1F3A;border-radius:22px 22px 0 0;padding:26px 26px 22px;">
      [% if kicker %]<div style="font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;color:#4ADE80;margin-bottom:8px;">[[ kicker ]]</div>[% endif %]
      <h1 style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:24px;line-height:1.25;font-weight:700;color:#FFFFFF;">[[ title ]]</h1>
    </td></tr>
    <tr><td bgcolor="#FFFFFF" style="background:#FFFFFF;border-radius:0 0 22px 22px;padding:24px 26px 26px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;color:#0B1F3A;">
      [[ body ]]
      [% if cta %]
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:22px 0 4px;"><tr>
        <td bgcolor="#22C55E" style="background:#22C55E;border-radius:14px;">
          <a href="[[ cta_url ]]" style="display:inline-block;padding:14px 22px;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;color:#052E16;text-decoration:none;">[[ cta ]]</a>
        </td>
      </tr></table>
      [% endif %]
    </td></tr>
    <tr><td style="padding:18px 8px 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.6;color:#7A889C;text-align:center;">
      [[ responsible ]]<br>
      [[ reason ]]<br>
      <a href="{{account_url}}" style="color:#15803D;font-weight:700;text-decoration:none;">[[ manage ]]</a>[% if unsubscribe %] · <a href="{{unsubscribe_url}}" style="color:#15803D;font-weight:700;text-decoration:none;">[[ unsub ]]</a>[% endif %]
    </td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
