# Réglages Supabase de Probalis (utilisés par « supabase functions deploy »). Voir docs/06-comptes-premium-emails.md.
project_id = "probalis"

# Chaque fonction vérifie elle-même qui appelle (jeton de connexion, signature Stripe ou Flutterwave,
# lien signé) : la vérification automatique de Supabase est donc coupée. Elle bloquerait les avis de paiement
# de Stripe et Flutterwave et les désinscriptions « en un clic », qui n'ont pas de jeton de connexion.
[functions.welcome]
verify_jwt = false

[functions.checkout]
verify_jwt = false

[functions.confirm-payment]
verify_jwt = false

[functions.payment-webhook]
verify_jwt = false

[functions.unsubscribe]
verify_jwt = false

# Récompenses, parrainage, notifications (jeton de connexion vérifié par la fonction) et admin (ADMIN_EMAILS)
[functions.member]
verify_jwt = false

[functions.admin]
verify_jwt = false

# Tâche du jour (GitHub Actions) : la fonction vérifie elle-même la clé secrète du projet
[functions.notify]
verify_jwt = false
